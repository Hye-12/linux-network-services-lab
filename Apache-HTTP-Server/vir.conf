<VirtualHost *:80>
    ServerName     hye12.local
    ServerAlias    www.hye12.local      
    DocumentRoot   "/var/www/html"
</VirtualHost>
      
<VirtualHost *:80>
    ServerName     blog.hye12.local
    DocumentRoot   "/var/www/blog"
</VirtualHost>

<Directory "/var/www/blog">
      Order        allow,deny
      Allow        from all
      Deny         from 10.0.0.101
</Directory>
      
<VirtualHost *:80>
    ServerName     intra.hye12.local
    DocumentRoot   "/var/www/intra"
</VirtualHost>

<Directory "/var/www/intra">
    AllowOverride  AuthConfig
</Directory>      
